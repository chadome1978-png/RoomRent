name: Build and deploy RoomRent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        run: |
          pnpm check
          pnpm test

      - name: Build static app
        run: pnpm build:static
      - name: Remove platform-only files from static output
        run: |
          rm -f dist/public/api/platform/config.js
          rm -f dist/public/__manus__/debug-collector.js
          rm -f dist/public/.gitkeep
          find dist/public -type d -empty -delete
          test -s dist/public/index.html
          test ! -e dist/public/api/platform/config.js
          test ! -e dist/public/__manus__/debug-collector.js
          test -z "$(find dist/public -type f -name '.*' -print -quit)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=roomrent-local-pwa --branch=main
