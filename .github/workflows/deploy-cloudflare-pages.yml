name: Build and deploy RoomRent to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomrent-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Validate Supabase build variables
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_KEY", "")

          if not url:
              fail("VITE_SUPABASE_URL repository variable is required")
          if url != url.strip():
              fail("VITE_SUPABASE_URL must not contain surrounding whitespace")
          try:
              parsed = urlsplit(url)
              host = parsed.hostname or ""
              port = parsed.port
          except ValueError:
              fail("VITE_SUPABASE_URL is not a valid URL origin")

          if (
              parsed.scheme != "https"
              or not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.supabase\.co", host)
              or parsed.netloc != host
              or port is not None
              or parsed.path
              or parsed.query
              or parsed.fragment
          ):
              fail("VITE_SUPABASE_URL must be exactly https://<project-ref>.supabase.co with no path, port, query, or fragment")

          if not key:
              fail("VITE_SUPABASE_ANON_KEY repository variable is required")
          if key != key.strip() or any(char.isspace() for char in key):
              fail("VITE_SUPABASE_ANON_KEY must not contain whitespace")

          if re.fullmatch(r"sb_publishable_[A-Za-z0-9_-]+", key):
              key_type = "publishable"
          else:
              parts = key.split(".")
              if len(parts) != 3 or not all(re.fullmatch(r"[A-Za-z0-9_-]+", part) for part in parts):
                  fail("VITE_SUPABASE_ANON_KEY must be an sb_publishable_ key or a valid legacy anon JWT")
              try:
                  header = json.loads(base64.b64decode(parts[0] + "=" * (-len(parts[0]) % 4), altchars=b"-_", validate=True))
                  payload = json.loads(base64.b64decode(parts[1] + "=" * (-len(parts[1]) % 4), altchars=b"-_", validate=True))
              except (ValueError, json.JSONDecodeError):
                  fail("Legacy Supabase key is not a decodable JWT")
              if not isinstance(header, dict) or not isinstance(payload, dict) or payload.get("role") != "anon":
                  fail("Legacy Supabase JWT must have role=anon; service-role keys are not allowed")
              key_type = "legacy anon JWT (role=anon)"

          print("Supabase URL origin validated")
          print(f"Supabase key validated: {key_type}; value not printed")
          PY

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository variable is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is required"; exit 1; }

      - name: Build static site
        run: pnpm build:static
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Remove platform-only files from static output
        run: |
          rm -f dist/public/api/platform/config.js
          rm -f dist/public/__manus__/debug-collector.js
          rm -f dist/public/.gitkeep
          find dist/public -type d -empty -delete
          test -s dist/public/index.html
          test ! -e dist/public/api/platform/config.js
          test ! -e dist/public/__manus__/debug-collector.js
          test -z "$(find dist/public -type f -name '.*' -print -quit)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=roomrent-local-pwa --branch=main
