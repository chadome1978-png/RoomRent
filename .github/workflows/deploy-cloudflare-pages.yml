name: Build and deploy RoomRent to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomrent-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight Cloudflare API token and Pages deploy permission
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          project_name = "roomrent-local-pwa"

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          def api_error_detail(raw_body):
              try:
                  errors = json.loads(raw_body).get("errors", [])
                  first = errors[0] if errors else {}
              except (json.JSONDecodeError, UnicodeDecodeError, AttributeError, TypeError):
                  return ""
              code = first.get("code")
              message = first.get("message", "")
              if not isinstance(message, str):
                  message = ""
              message = message.replace(token, "[REDACTED]")
              message = re.sub(r"[\r\n]+", " ", message)
              message = re.sub(r"[^A-Za-z0-9 .,_/()'\-]", "?", message)[:180]
              detail = f"Cloudflare error {code}" if code is not None else ""
              if message:
                  detail += f": {message}"
              return detail

          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              fail("CLOUDFLARE_ACCOUNT_ID repository variable is missing or malformed")
          if not token:
              fail("CLOUDFLARE_API_TOKEN repository secret is missing")
          if token != token.strip() or any(char.isspace() for char in token):
              fail("CLOUDFLARE_API_TOKEN contains whitespace; value not printed")

          verify_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/tokens/verify"
          )
          verify_request = Request(verify_url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urlopen(verify_request, timeout=20) as response:
                  verify_result = json.loads(response.read())
          except HTTPError as error:
              detail = api_error_detail(error.read(65536))
              suffix = f"; {detail}" if detail else ""
              fail(f"Cloudflare Account API token verification failed (HTTP {error.code}){suffix}")
          except (URLError, TimeoutError):
              fail("Cloudflare Account API token verification could not reach the API")
          except (json.JSONDecodeError, UnicodeDecodeError):
              fail("Cloudflare Account API token verification returned an invalid response")

          if not verify_result.get("success") or verify_result.get("result", {}).get("status") != "active":
              detail = api_error_detail(json.dumps(verify_result).encode())
              suffix = f"; {detail}" if detail else ""
              fail(f"Cloudflare Account API token is not active{suffix}")
          print("Cloudflare Account API token verified active; value not printed")

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/pages/projects/{project_name}"
          )
          request = Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urlopen(request, timeout=20) as response:
                  result = json.loads(response.read())
          except HTTPError as error:
              detail = api_error_detail(error.read(65536))
              suffix = f"; {detail}" if detail else ""
              if error.code in (401, 403):
                  fail(f"Cloudflare token rejected or lacks Pages access (HTTP {error.code}){suffix}")
              fail(f"Cloudflare Pages preflight failed (HTTP {error.code}){suffix}")
          except (URLError, TimeoutError):
              fail("Cloudflare Pages preflight could not reach the API")
          except (json.JSONDecodeError, UnicodeDecodeError):
              fail("Cloudflare Pages preflight returned an invalid response")

          if not result.get("success"):
              detail = api_error_detail(json.dumps(result).encode())
              suffix = f"; {detail}" if detail else ""
              fail(f"Cloudflare Pages API returned an unsuccessful response{suffix}")
          if result.get("result", {}).get("name") != project_name:
              fail("Cloudflare token can access Pages, but the expected project name did not match")

          upload_request = Request(
              f"{url}/upload-token",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urlopen(upload_request, timeout=20) as response:
                  upload_result = json.loads(response.read())
          except HTTPError as error:
              detail = api_error_detail(error.read(65536))
              suffix = f"; {detail}" if detail else ""
              if error.code in (401, 403):
                  fail(
                      "Cloudflare token rejected or lacks Account > Cloudflare Pages > Edit "
                      f"permission for Direct Upload (HTTP {error.code}){suffix}"
                  )
              fail(f"Cloudflare Pages deploy permission check failed (HTTP {error.code}){suffix}")
          except (URLError, TimeoutError):
              fail("Cloudflare Pages deploy permission check could not reach the API")
          except (json.JSONDecodeError, UnicodeDecodeError):
              fail("Cloudflare Pages deploy permission check returned an invalid response")

          if not upload_result.get("success") or not isinstance(
              upload_result.get("result", {}).get("jwt"), str
          ):
              detail = api_error_detail(json.dumps(upload_result).encode())
              suffix = f"; {detail}" if detail else ""
              fail(f"Cloudflare Pages upload-token permission check failed{suffix}")

          print("Cloudflare Pages project and Direct Upload permission validated; temporary JWT discarded")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Validate Supabase build variables
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_KEY", "")

          if not url:
              fail("VITE_SUPABASE_URL repository variable is required")
          if url != url.strip():
              fail("VITE_SUPABASE_URL must not contain surrounding whitespace")
          try:
              parsed = urlsplit(url)
              host = parsed.hostname or ""
              port = parsed.port
          except ValueError:
              fail("VITE_SUPABASE_URL is not a valid URL origin")

          if (
              parsed.scheme != "https"
              or not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.supabase\.co", host)
              or parsed.netloc != host
              or port is not None
              or parsed.path
              or parsed.query
              or parsed.fragment
          ):
              fail("VITE_SUPABASE_URL must be exactly https://<project-ref>.supabase.co with no path, port, query, or fragment")

          if not key:
              fail("VITE_SUPABASE_ANON_KEY repository variable is required")
          if key != key.strip() or any(char.isspace() for char in key):
              fail("VITE_SUPABASE_ANON_KEY must not contain whitespace")

          if re.fullmatch(r"sb_publishable_[A-Za-z0-9_-]+", key):
              key_type = "publishable"
          else:
              parts = key.split(".")
              if len(parts) != 3 or not all(re.fullmatch(r"[A-Za-z0-9_-]+", part) for part in parts):
                  fail("VITE_SUPABASE_ANON_KEY must be an sb_publishable_ key or a valid legacy anon JWT")
              try:
                  header = json.loads(base64.b64decode(parts[0] + "=" * (-len(parts[0]) % 4), altchars=b"-_", validate=True))
                  payload = json.loads(base64.b64decode(parts[1] + "=" * (-len(parts[1]) % 4), altchars=b"-_", validate=True))
              except (ValueError, json.JSONDecodeError):
                  fail("Legacy Supabase key is not a decodable JWT")
              if not isinstance(header, dict) or not isinstance(payload, dict) or payload.get("role") != "anon":
                  fail("Legacy Supabase JWT must have role=anon; service-role keys are not allowed")
              key_type = "legacy anon JWT (role=anon)"

          print("Supabase URL origin validated")
          print(f"Supabase key validated: {key_type}; value not printed")
          PY

      - name: Build static site
        run: pnpm build:static
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Remove platform-only files from static output
        run: |
          rm -f dist/public/api/platform/config.js
          rm -f dist/public/__manus__/debug-collector.js
          rm -f dist/public/.gitkeep
          find dist/public -type d -empty -delete
          test -s dist/public/index.html
          test ! -e dist/public/api/platform/config.js
          test ! -e dist/public/__manus__/debug-collector.js
          test -z "$(find dist/public -type f -name '.*' -print -quit)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=roomrent-local-pwa --branch=main
