<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>รหัสเข้าสู่ระบบ RoomRent</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f2f5f3; color:#1b2721; font-family:Arial,'Noto Sans Thai',Tahoma,sans-serif;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">รหัส OTP สำหรับเข้าสู่ระบบ RoomRent</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#f2f5f3; border-collapse:collapse;">
      <tr>
        <td align="center" style="padding:32px 14px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px; background-color:#ffffff; border:1px solid #dce5df; border-radius:14px; border-collapse:separate;">
            <tr>
              <td style="padding:28px 28px 12px; background-color:#183b2e; border-radius:13px 13px 0 0;">
                <p style="margin:0; color:#cce3d5; font-size:13px; line-height:20px; letter-spacing:1px;">ROOMRENT</p>
                <h1 style="margin:8px 0 0; color:#ffffff; font-size:23px; line-height:32px; font-weight:700;">รหัสเข้าสู่ระบบ</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 28px 30px;">
                <p style="margin:0 0 14px; color:#26352d; font-size:16px; line-height:26px;">ใช้รหัส OTP ด้านล่างเพื่อเข้าสู่ระบบ RoomRent ด้วยอีเมลของคุณ</p>
                <div style="margin:22px 0; padding:18px 12px; background-color:#edf5ef; border:1px solid #d4e5d8; border-radius:10px; text-align:center;">
                  <span style="display:block; margin-bottom:8px; color:#4b6254; font-size:12px; line-height:18px; letter-spacing:1px;">รหัส OTP 6 หลัก</span>
                  <strong style="display:block; color:#183b2e; font-family:Arial,Tahoma,sans-serif; font-size:34px; line-height:42px; letter-spacing:8px;">{{ .Token }}</strong>
                </div>
                <p style="margin:0; color:#68766d; font-size:13px; line-height:21px;">หากคุณไม่ได้ขอรหัสนี้ สามารถละเว้นอีเมลฉบับนี้ได้ รหัสใช้ได้ครั้งเดียวและอย่าส่งต่อให้ผู้อื่น</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0; color:#78857d; font-size:12px; line-height:19px; text-align:center;">RoomRent · ระบบจัดการห้องเช่า</p>
        </td>
      </tr>
    </table>
  </body>
</html>
